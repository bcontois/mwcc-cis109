info:
  name: coordinates
  type: http

http:
  method: GET
  url: https://nominatim.openstreetmap.org/search?q=Gardner, MA&format=json&limit=1
  params:
    - name: q
      value: Gardner, MA
      type: query
    - name: format
      value: json
      type: query
    - name: limit
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
